
name: Render Arvion Reel

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voz da narração"
        required: true
        default: "pt-BR-AntonioNeural"

permissions:
  contents: read

jobs:
  render:
    name: Gerar Reel Arvion Lab
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Instalar dependências Node
        run: npm install

      - name: Instalar Edge TTS
        run: python -m pip install --upgrade edge-tts

      - name: Gerar narração e tempos das palavras
        run: python scripts/gerar_narracao.py --voz "${{ inputs.voice }}"

      - name: Verificar arquivos gerados
        run: |
          test -f src/wordTimings.json
          test -s src/wordTimings.json
          test -f public/audio/narracao/n0.mp3
          echo "Arquivos de narração encontrados."

      - name: Verificar TypeScript
        run: npm run check

      - name: Renderizar MP4
        run: npm run render

      - name: Salvar vídeo
        uses: actions/upload-artifact@v4
        with:
          name: arvion-lab-reel
          path: out/arvion-reel-ia.mp4
          if-no-files-found: error
          retention-days: 14
